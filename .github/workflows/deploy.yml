name: Deploy Miftahul Mubin to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare public assets
        run: |
          test -f hero-bg.png
          cp hero-bg.png public/hero-bg.png
          test -f public/logo.svg

      - name: Validate Supabase configuration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "NEXT_PUBLIC_SUPABASE_URL is missing from repository secrets"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is missing from repository secrets"; exit 1; }
          echo "Supabase environment variables are configured."

      - name: Smoke test Supabase REST
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/news?select=id&limit=1" \
            -o /tmp/supabase-news.json
          test -s /tmp/supabase-news.json
          echo "Supabase REST smoke test passed."

      - name: TypeScript check
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Verify Pages output
        run: |
          test -f out/index.html
          test -f out/hero-bg.png
          test -f out/logo.svg
          test -d out/_next
          test -f out/404.html || test -f out/_not-found/index.html
          grep -q '/miftahul-mubin/_next/' out/index.html
          grep -q '/miftahul-mubin/logo.svg' out/index.html
          if grep -RInE '<a[^>]*href="/(berita|kegiatan|keislaman)/' out --include='*.html'; then
            echo "Found an internal content link without the GitHub Pages basePath."
            exit 1
          fi
          echo "GitHub Pages routing smoke test passed."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify public deployment
        run: |
          url="https://xygritte.github.io/miftahul-mubin/"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$url" -o /tmp/site.html; then
              grep -qi 'Miftahul Mubin' /tmp/site.html && exit 0
            fi
            sleep 5
          done
          echo "Public GitHub Pages deployment did not become reachable in time."
          exit 1
